<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080f20">
    <meta name="description" content="صفحه مورد نظر در تیک راه پیدا نشد.">
    <title>صفحه پیدا نشد | تیک راه</title>
    <link rel="icon" type="image/png" href="/assets/img/favicon.png">
    <link rel="stylesheet" href="/assets/css/404.css">
</head>
<body>
<div class="error-stage">
    <div class="ambient" aria-hidden="true"><span class="orb orb-blue"></span><span class="orb orb-purple"></span><span
            class="orb orb-teal"></span></div>
    <div class="background-grid" aria-hidden="true"></div>
    <header class="site-header">
        <a class="brand" href="/" aria-label="بازگشت به تیک راه">

    <main class="error-card">

                <defs>
                    <linearGradient id="halo" x1="0" x2="1" y1="0" y2="1">
                        <stop stop-color="#6687ff" stop-opacity=".26"/>
                        <stop offset="1" stop-color="#8a63e9" stop-opacity=".08"/>
                    </linearGradient>
                    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
                        <stop stop-color="#263c6b"/>
                        <stop offset="1" stop-color="#182642"/>
                    </linearGradient>
                    <filter id="shadow">
                        <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#020615" flood-opacity=".45"/>
                    </filter>
                </defs>
                <circle cx="210" cy="160" r="126" fill="url(#halo)"/>
                <ellipse cx="210" cy="160" rx="169" ry="96" transform="rotate(-28 210 160)" fill="none" stroke="#8b9dff"
                         stroke-opacity=".34"/>
                <ellipse cx="210" cy="160" rx="171" ry="105" transform="rotate(42 210 160)" fill="none" stroke="#8b9dff"
                         stroke-opacity=".23"/>
                <g transform="rotate(-6 204 164)" filter="url(#shadow)">
                    <path d="M149 57H231L278 104V267Q278 277 268 277H149Q139 277 139 267V67Q139 57 149 57Z"
                          fill="url(#paper)" stroke="#9ba9ff" stroke-width="3"/>
                    <path d="M231 57V94Q231 104 241 104H278" fill="none" stroke="#9ba9ff" stroke-width="3"/>
                    <path d="M171 145H243M171 172H229" stroke="#8193bd" stroke-width="7" stroke-linecap="round"
                          opacity=".7"/>
                </g>
                <circle cx="248" cy="205" r="39" fill="#5d5ce8" stroke="#a4a9ff" stroke-opacity=".6" stroke-width="2"/>
                <text x="248" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="66" fill="white">
                    ?
                </text>
                <text x="320" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-weight="800"
                      font-size="70" fill="#8184ff">404
                </text>
                <path d="M339 40L343 49L352 53L343 57L339 66L335 57L326 53L335 49Z" fill="#9e90ff"/>
                <path d="M65 233L69 243L79 247L69 251L65 261L61 251L51 247L61 243Z" fill="none" stroke="#8b9dff"
                      stroke-width="2"/>
            </svg>
        </div>
        <div class="error-content">
            <span class="eyebrow"><span class="eyebrow-dot"></span> اوه، اینجا چیزی نیست!</span>
            <h1>صفحه پیدا نشد</h1>
            <p>به نظر می‌رسد این صفحه جابه‌جا شده یا دیگر وجود ندارد. نگران نباش، می‌توانی از صفحه اصلی دوباره شروع
                کنی.</p>
            <a class="home-button" href="/">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                    <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
                </svg>
                <span>بازگشت به صفحه اصلی</span>
            </a>
        </div>
    </main>
    <footer><span class="status-dot"></span> قدم‌های کوچک، پیشرفت‌های بزرگ</footer>
</div>
</body>
</html>
